services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: simkos_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./storage/app:/var/www/html/storage/app
      - ./storage/framework:/var/www/html/storage/framework
      - ./storage/logs:/var/www/html/storage/logs
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=pgsql
      - DB_HOST=database
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-simkos}
      - DB_USERNAME=${DB_USERNAME:-simkos}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - simkos-network

  webserver:
    image: nginx:alpine
    container_name: simkos_webserver
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - simkos-network

  database:
    image: postgres:15-alpine
    container_name: simkos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-simkos}
      POSTGRES_USER: ${DB_USERNAME:-simkos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-simkos} -d ${DB_DATABASE:-simkos}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - simkos-network

  redis:
    image: redis:7-alpine
    container_name: simkos_redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - simkos-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  simkos-network:
    driver: bridge
